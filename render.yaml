services:
  - type: web
    name: job-rag-backend
    env: python
    plan: starter
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn api:app --bind 0.0.0.0:$PORT --timeout 120 --preload
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: EMBEDDINGS_DIR
        value: /opt/render/project/src/embeddings
    disk:
      name: embeddings-disk
      mountPath: /opt/render/project/src/embeddings
      sizeGB: 2

